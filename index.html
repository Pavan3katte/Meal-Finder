<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
    <nav class="header" >
        <h2 id="mealFinderHome"><i class="fa-solid fa-house"></i>MEAL FINDER</h2>
        <button id="menu-btn"><i class="fa-solid fa-bars"></i></button>
    </nav>
    <div class="side-menu" id="sideMenu">

    <button id="closeMenu">
        <i class="fa-solid fa-circle-xmark"></i>
    </button>

    <div id="menuCategories"></div>

</div>

    <section class="hero">

        <div class="search-box">
            <input type="text" id="searchInput"
                placeholder="Search recipes here...">
                <button id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
<h2>What are your favorite cuisines?</h2>

<p>PERSONALIZE YOUR EXPERIENCE</p>
    </section>

    <section class="category-info-section" id="categoryInfo">

    <h2 id="categoryName"></h2>

    <p id="categoryDescription"></p>

</section>

<section class="meals-section">

    <h2>MEALS</h2>

    <div id="mealsContainer"></div>

</section>


<section class="meal-details-section">

    <div class="breadcrumb">
        <i class="fa-solid fa-house"></i>
        <span>»</span>
        <span id="breadcrumbMeal"></span>
    </div>

    <h2 class="details-title">MEAL DETAILS</h2>

    <div id="mealDetails"></div>

</section>



    <section class="categories-section">

        <h2>CATEGORIES</h2>

        <div id="categoriesContainer"></div>

    </section>
    <script src="js/script.js"></script>

</body>
</html>
